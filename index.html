<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Resource: ADSO Technical Terms (SDLC)</title>
    <!-- Fuentes Educativas y Modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería de Confeti para Efecto WOW -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            /* Paleta EdTech Premium */
            --sena-blue: #002244; /* Azul más oscuro y elegante */
            --sena-blue-light: #2563eb;
            --sena-blue-gradient: linear-gradient(135deg, #001f3f, #003366, #2563eb, #003366);
            --sena-orange: #FF6C0C;
            --sena-orange-gradient: linear-gradient(135deg, #FF6C0C, #ff8c42);
            --bg-main: #f8fafc; /* Blanco roto súper limpio */
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #475569;
            --success: #10b981;
            --error: #ef4444;
            --border-radius: 28px;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 20px 40px rgba(37, 99, 235, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 { font-family: 'Quicksand', sans-serif; font-weight: 800; }

        /* --- HEADER ANIMADO PREMIUM --- */
        header {
            background: var(--sena-blue-gradient);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: white;
            padding: 40px 20px 35px;
            text-align: center;
            border-bottom: 8px solid var(--sena-orange);
            position: relative;
            box-shadow: 0 15px 30px rgba(0, 34, 68, 0.3);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-sena {
            height: 85px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.4));
            background-color: white;
            padding: 8px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        .logo-sena:hover { transform: scale(1.1) rotate(5deg); }

        header h1 { font-size: 38px; margin-bottom: 8px; text-shadow: 2px 4px 8px rgba(0,0,0,0.4); letter-spacing: -1px;}
        header p { font-size: 18px; font-weight: 400; opacity: 0.9; letter-spacing: 1.5px; text-transform: uppercase;}

        .team-banner {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            color: #facc15;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- TABS DE NAVEGACIÓN ESTILO APP --- */
        nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 10px;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: sticky; top: 0; z-index: 100;
        }

        nav button {
            background: var(--bg-main);
            border: 2px solid #e2e8f0;
            border-radius: 100px; /* Diseño de Píldora */
            padding: 12px 24px;
            font-size: 15px; font-family: 'Quicksand', sans-serif; font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; align-items: center; gap: 10px;
        }

        nav button:hover { 
            transform: translateY(-3px);
            color: var(--sena-blue-light); border-color: #bfdbfe;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.1);
        }
        
        nav button.active {
            background: var(--sena-orange-gradient);
            color: white;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 108, 12, 0.3);
            transform: translateY(-3px);
        }

        main { flex: 1; padding: 60px 20px; max-width: 1300px; margin: 0 auto; width: 100%; }

        /* --- ANIMACIONES FLUIDAS --- */
        .fade-in { animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(30px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .pulse-soft { animation: pulseSoft 2s infinite alternate; }
        @keyframes pulseSoft { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* --- TARJETAS PREMIUM (CARDS) --- */
        .cards-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 40px; margin-bottom: 60px;
        }

        .term-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-md);
            position: relative;
        }
        .term-card:hover { 
            transform: translateY(-12px); 
            box-shadow: var(--shadow-hover); 
            border-color: #bfdbfe;
        }

        .term-img-container { 
            position: relative; height: 220px; width: 100%; 
            background: #e2e8f0; overflow: hidden;
        }
        
        /* Overlay oscuro elegante sobre la imagen */
        .term-img-container::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }

        .term-img { 
            width: 100%; height: 100%; object-fit: cover; object-position: center;
            transition: transform 0.6s ease;
        }
        .term-card:hover .term-img { transform: scale(1.12); }

        .tool-badge {
            position: absolute; bottom: 20px; right: 20px;
            background: var(--sena-orange-gradient); color: white;
            width: 50px; height: 50px; border-radius: 16px; /* Cuadrado con bordes curvos */
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            box-shadow: 0 8px 15px rgba(255, 108, 12, 0.4);
            z-index: 2;
            transform: rotate(-5deg);
        }
        .term-card:hover .tool-badge { transform: rotate(0deg) scale(1.1); transition: all 0.3s; }

        .term-content { padding: 30px; flex: 1; display: flex; flex-direction: column; }
        .term-title { color: var(--sena-blue); font-size: 28px; margin-bottom: 5px; line-height: 1.1;}
        .term-translation { color: var(--text-light); font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px;}
        
        .term-phonetic {
            background: #f1f5f9; color: var(--sena-blue-light); padding: 10px 18px; border-radius: 14px;
            font-size: 16px; font-weight: 700; align-self: flex-start; margin-bottom: 20px;
            border-left: 4px solid var(--sena-blue-light);
            display: flex; align-items: center; gap: 8px;
        }

        .term-desc { font-size: 15px; line-height: 1.7; margin-bottom: 25px; flex: 1; color: #334155;}
        .lang-badge { 
            display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: white; margin-right: 12px; vertical-align: top; margin-top: 3px;
        }
        .bg-en { background: var(--sena-blue-light); }
        .bg-es { background: var(--success); }
        .desc-p { margin-bottom: 15px; display: flex; align-items: flex-start;}

        /* Reproductor Estilizado */
        .audio-player {
            width: 100%; margin-top: auto; padding: 15px; border-radius: 16px;
            background: #f8fafc; border: 1px solid #e2e8f0; text-align: center;
        }
        .audio-player audio { width: 100%; height: 40px; border-radius: 20px; outline: none; }
        .audio-player small { font-size: 11px; color: #94a3b8; font-weight: 600; display: block; margin-top: 8px;}

        /* --- ZONA DE GAMIFICACIÓN (EDTECH UI) --- */
        .game-section {
            background: white; padding: 60px 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 34, 68, 0.08); 
            border: 1px solid #e2e8f0;
            text-align: center; margin-top: 40px; position: relative; overflow: hidden;
        }
        
        /* Barra de Progreso Visual */
        .progress-container {
            width: 100%; max-width: 500px; height: 12px; background: #e2e8f0; border-radius: 10px;
            margin: 0 auto 30px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background: var(--sena-orange-gradient); width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 10px;
        }

        .game-header { margin-bottom: 40px; }
        .game-header h3 { font-size: 36px; color: var(--sena-blue); letter-spacing: -1px;}
        .game-header p { font-weight: 500; color: var(--text-light); font-size: 18px; margin-top: 5px;}

        /* Botones 3D Estilo Gamificado */
        .game-btn {
            background: white; border: 2px solid #cbd5e1; 
            box-shadow: 0 6px 0 #cbd5e1; /* Sombra inferior sólida para efecto 3D */
            padding: 20px 30px; border-radius: 20px; font-size: 18px; font-family: 'Poppins', sans-serif; font-weight: 700;
            color: var(--sena-blue); cursor: pointer; transition: all 0.1s; display: inline-flex; justify-content: center; align-items: center; gap: 12px;
            width: 100%; margin-bottom: 12px;
        }
        .game-btn:active, .game-btn.pressed { 
            transform: translateY(6px); box-shadow: 0 0 0 #cbd5e1; 
        }
        .game-btn:hover:not(:active):not(.correct):not(.error) { 
            border-color: var(--sena-blue-light); box-shadow: 0 6px 0 var(--sena-blue-light); color: var(--sena-blue-light);
        }
        
        .game-btn.correct { background: #dcfce7; border-color: var(--success); box-shadow: 0 6px 0 #059669; color: #065f46; }
        .game-btn.correct:active { box-shadow: 0 0 0 #059669; }
        
        .game-btn.error { background: #fee2e2; border-color: var(--error); box-shadow: 0 6px 0 #b91c1c; color: #991b1b; }
        .game-btn.error:active { box-shadow: 0 0 0 #b91c1c; }

        /* Ajustes específicos de juegos */
        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1000px; margin: 0 auto; }
        .match-col { display: flex; flex-direction: column; gap: 10px; }
        .match-btn { text-align: left; justify-content: flex-start; padding: 18px 25px; font-size: 16px;}
        .match-btn.selected { background: #eff6ff; border-color: var(--sena-blue-light); box-shadow: 0 6px 0 var(--sena-blue-light); color: var(--sena-blue-light); }
        .match-btn.matched { visibility: hidden; opacity: 0; transition: visibility 0s 0.4s, opacity 0.4s linear; }

        .tf-card { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 24px; padding: 40px 30px; max-width: 800px; margin: 0 auto 30px; }
        .tf-term { font-size: 38px; color: var(--sena-orange); font-family: 'Quicksand'; font-weight: 900; margin-bottom: 20px; }
        .tf-desc { font-size: 22px; font-weight: 600; color: var(--sena-blue); line-height: 1.5;}
        .tf-actions { display: flex; justify-content: center; gap: 30px; }
        
        .action-btn {
            background: var(--sena-blue-gradient); color: white; border: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4), 0 6px 0 #003366;
            padding: 16px 45px; border-radius: 20px; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.1s; font-family: 'Quicksand';
        }
        .action-btn:active { transform: translateY(6px); box-shadow: 0 2px 5px rgba(37, 99, 235, 0.4), 0 0 0 #003366;}
        
        .action-btn.green { background: var(--success); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3), 0 6px 0 #047857;}
        .action-btn.green:active { box-shadow: 0 2px 5px rgba(16, 185, 129, 0.3), 0 0 0 #047857; }
        
        .action-btn.red { background: var(--error); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3), 0 6px 0 #b91c1c;}
        .action-btn.red:active { box-shadow: 0 2px 5px rgba(239, 68, 68, 0.3), 0 0 0 #b91c1c; }

        .feedback-msg { font-size: 24px; font-weight: 800; margin: 25px 0; min-height: 35px; }

        /* --- GUIAS Y CAJAS DE TEXTO --- */
        .instructions-box, .phonetic-guide-box { 
            background: white; padding: 40px; border-radius: 30px; 
            border-left: 10px solid var(--sena-orange); 
            box-shadow: var(--shadow-md); text-align: left; margin-top: 20px;
        }
        .instructions-box h3, .phonetic-guide-box h2 { color: var(--sena-blue); margin-bottom: 20px; font-size: 28px;}
        .instructions-box ul { padding-left: 25px; line-height: 2; font-weight: 500; color: var(--text-light); font-size: 18px;}
        .instructions-box code { background: #f1f5f9; padding: 5px 12px; border-radius: 8px; color: var(--sena-blue-light); font-weight: 700; font-family: monospace;}

        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 30px; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0;}
        th { background: var(--sena-blue); color: white; padding: 18px; font-family: 'Quicksand'; font-size: 18px;}
        td { padding: 18px; border-bottom: 1px solid #e2e8f0; font-weight: 500; color: var(--text-dark); font-size: 16px; background: white;}
        tr:last-child td { border-bottom: none; }
        .highlight-accent { color: var(--sena-orange); font-weight: 800; }

        /* Icono trofeo final animado */
        .win-icon { font-size: 90px; color: #facc15; filter: drop-shadow(0 10px 15px rgba(250, 204, 21, 0.3)); margin-bottom: 20px; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    </style>
</head>
<body>

    <header>
        <!-- Logo Oficial SENA Animado -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA Logo" class="logo-sena">
        <h1>SDLC Technical Glossary</h1>
        <p>Interactive EdTech Platform • ADSO Program</p>
    </header>
    <div class="team-banner">
        <i class="fas fa-rocket"></i> Team: Andrea Robles, Johan Brionis, Hernan Contreras, Marlon Herrera
    </div>

    <nav id="main-nav">
        <button onclick="navigate('home')" id="btn-home" class="active"><i class="fas fa-home"></i> Inicio</button>
        <button onclick="navigate('phase1')" id="btn-phase1"><i class="fas fa-search"></i> Phase 1</button>
        <button onclick="navigate('phase2')" id="btn-phase2"><i class="fas fa-pen-ruler"></i> Phase 2</button>
        <button onclick="navigate('phase3')" id="btn-phase3"><i class="fas fa-code"></i> Phase 3</button>
        <button onclick="navigate('phase4')" id="btn-phase4"><i class="fas fa-bug"></i> Phase 4</button>
        <button onclick="navigate('phase5')" id="btn-phase5"><i class="fas fa-server"></i> Phase 5</button>
        <button onclick="navigate('phonetic')" id="btn-phonetic"><i class="fas fa-microphone-alt"></i> Guía Fonética</button>
    </nav>

    <main id="app-container">
        <!-- Contenido Inyectado Dinámicamente -->
    </main>

    <script>
        // BASE DE DATOS JSON - FONÉTICA EN ESPAÑOL
        const vocabularyData = [
            {"phase":1,"term":"Requirement","translation":"Requisito","desc_es":"Condición o capacidad que debe cumplir el sistema para resolver un problema o lograr un objetivo.","phonetic":"ri-CUÁI-er-ment","desc_en":"Condition or capability that the system must meet to solve a problem or achieve an objective."},
            {"phase":1,"term":"Stakeholder","translation":"Interesado / Actor Clave","desc_es":"Persona, grupo u organización que tiene un interés o se ve afectado por el proyecto.","phonetic":"stéik-JÓL-der","desc_en":"Person, group, or organization that has an interest in or is affected by the project."},
            {"phase":1,"term":"Feasibility Study","translation":"Estudio de Viabilidad","desc_es":"Evaluación para determinar si un proyecto es técnica, económica y operacionalmente posible.","phonetic":"fi-si-BÍ-li-ti STÁ-di","desc_en":"Evaluation to determine if a project is technically, economically, and operationally possible."},
            {"phase":1,"term":"Scope","translation":"Alcance","desc_es":"Límites y objetivos del proyecto, incluyendo entregables y funcionalidades.","phonetic":"SCÓUP","desc_en":"Project limits and objectives, including deliverables and features."},
            {"phase":1,"term":"Business Case","translation":"Caso de Negocio","desc_es":"Documento que justifica la inversión en un proyecto, detallando beneficios, costos y riesgos.","phonetic":"BÍS-nes kéis","desc_en":"Document that justifies the investment in a project, detailing benefits, costs, and risks."},
            {"phase":1,"term":"Gathering","translation":"Recolección / Levantamiento","desc_es":"Proceso de obtención de requisitos de los interesados.","phonetic":"GÁ-de-ring","desc_en":"Process of obtaining requirements from stakeholders."},
            {"phase":1,"term":"Modeling","translation":"Modelado","desc_es":"Proceso de creación de representaciones abstractas de un sistema.","phonetic":"MÓ-de-ling","desc_en":"Process of creating abstract representations of a system."},
            {"phase":1,"term":"Elicitation","translation":"Obtención / Descubrimiento","desc_es":"Técnica para extraer requisitos de los stakeholders.","phonetic":"e-li-si-TÉI-shon","desc_en":"Technique for extracting requirements from stakeholders."},
            {"phase":1,"term":"Acceptance Criteria","translation":"Criterios de Aceptación","desc_es":"Condiciones que debe cumplir el software para ser aceptado por el cliente.","phonetic":"ak-SÉP-tans crai-TÍ-ria","desc_en":"Conditions that the software must meet to be accepted by the client."},
            {"phase":1,"term":"Constraint","translation":"Restricción / Limitación","desc_es":"Factor que limita las opciones de desarrollo (ej. tiempo, presupuesto, tecnología).","phonetic":"cons-TRÉINT","desc_en":"Factor that limits development options (e.g., time, budget, technology)."},
            {"phase":1,"term":"Use Case","translation":"Caso de Uso","desc_es":"Descripción de una interacción del usuario con el sistema para lograr un objetivo específico.","phonetic":"IÚS kéis","desc_en":"Description of a user interaction with the system to achieve a specific goal."},
            {"phase":1,"term":"Functional Requirement","translation":"Requisito Funcional","desc_es":"Describe lo que el sistema debe hacer (funciones y comportamientos).","phonetic":"FÚNC-sho-nal ri-CUÁI-er-ment","desc_en":"Describes what the system must do (functions and behaviors)."},
            {"phase":1,"term":"Non-functional Requirement","translation":"Requisito No Funcional","desc_es":"Describe cómo el sistema debe ser (ej. rendimiento, seguridad, usabilidad).","phonetic":"NON-fúnc-sho-nal ri-CUÁI-er-ment","desc_en":"Describes how the system should be (e.g., performance, security, usability)."},
            {"phase":1,"term":"Estimates","translation":"Estimaciones","desc_es":"Cálculos aproximados de tiempo, costo y esfuerzo necesarios.","phonetic":"ÉS-ti-meits","desc_en":"Approximate calculations of required time, cost, and effort."},
            {"phase":1,"term":"Resource Allocation","translation":"Asignación de Recursos","desc_es":"Distribución de personas, equipos y presupuesto al proyecto.","phonetic":"RÍ-sors a-lo-KÉI-shon","desc_en":"Distribution of people, equipment, and budget to the project."},
            {"phase":2,"term":"Architecture","translation":"Arquitectura","desc_es":"Estructura fundamental de un sistema y sus componentes, sus relaciones y principios de diseño.","phonetic":"ar-ki-TÉC-chur","desc_en":"Fundamental structure of a system and its components, relations, and design principles."},
            {"phase":2,"term":"Design Pattern","translation":"Patrón de Diseño","desc_es":"Solución reutilizable a un problema común en el diseño de software.","phonetic":"di-SÁIN PÁ-tern","desc_en":"Reusable solution to a common problem in software design."},
            {"phase":2,"term":"Interface","translation":"Interfaz","desc_es":"Punto de interacción entre componentes o entre el sistema y el usuario.","phonetic":"ÍN-ter-feis","desc_en":"Point of interaction between components or between the system and the user."},
            {"phase":2,"term":"User Interface (UI)","translation":"Interfaz de Usuario","desc_es":"Componentes visuales y elementos con los que el usuario interactúa.","phonetic":"IÚ-ser ÍN-ter-feis / IÚ-ÁI","desc_en":"Visual components and elements with which the user interacts."},
            {"phase":2,"term":"User Experience (UX)","translation":"Experiencia de Usuario","desc_es":"Sentimientos, actitudes y percepciones del usuario al interactuar con el producto.","phonetic":"IÚ-ser eks-PÍ-riens / IÚ-EKS","desc_en":"Feelings, attitudes, and perceptions of the user when interacting with the product."},
            {"phase":2,"term":"Prototype","translation":"Prototipo","desc_es":"Versión inicial o simulada de un producto o funcionalidad para pruebas.","phonetic":"PRÓ-to-taip","desc_en":"Initial or simulated version of a product or feature for testing."},
            {"phase":2,"term":"Database","translation":"Base de Datos","desc_es":"Colección organizada de información estructurada.","phonetic":"DÉI-ta-beis","desc_en":"Organized collection of structured information."},
            {"phase":2,"term":"Schema","translation":"Esquema","desc_es":"Estructura o diseño de una base de datos o de otro modelo de información.","phonetic":"SKÍ-ma","desc_en":"Structure or design of a database or another information model."},
            {"phase":2,"term":"Algorithm","translation":"Algoritmo","desc_es":"Conjunto definido y ordenado de instrucciones para resolver un problema.","phonetic":"ÁL-go-ri-dem","desc_en":"Defined and ordered set of instructions to solve a problem."},
            {"phase":2,"term":"Component","translation":"Componente","desc_es":"Parte modular y reemplazable de un sistema de software.","phonetic":"com-PÓU-nent","desc_en":"Modular and replaceable part of a software system."},
            {"phase":2,"term":"Modularity","translation":"Modularidad","desc_es":"Grado en que un sistema de software está compuesto por partes funcionales separables y combinables.","phonetic":"mo-diu-LÁ-ri-ti","desc_en":"Degree to which a software system is composed of separable functional parts."},
            {"phase":2,"term":"Diagram","translation":"Diagrama","desc_es":"Representación gráfica de la estructura, comportamiento o diseño del sistema.","phonetic":"DÁI-a-gram","desc_en":"Graphical representation of the structure, behavior, or design of the system."},
            {"phase":2,"term":"Wireframe","translation":"Estructura / Esqueleto (de diseño)","desc_es":"Diseño esquemático de la disposición de una interfaz sin detalles visuales.","phonetic":"UÁIR-freim","desc_en":"Schematic design of the layout of an interface without visual details."},
            {"phase":2,"term":"Mockup","translation":"Maqueta","desc_es":"Representación estática y visual de cómo se verá el producto final.","phonetic":"MÓ-cap","desc_en":"Static and visual representation of how the final product will look."},
            {"phase":2,"term":"Scalability","translation":"Escalabilidad","desc_es":"Capacidad del sistema para manejar un crecimiento en la carga de trabajo o en los usuarios.","phonetic":"skei-la-BÍ-li-ti","desc_en":"System's capacity to handle growth in workload or users."},

        /* --- FUNCIONES WOW --- */
        function triggerConfetti() {
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#003265', '#2563eb', '#FF6C0C'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#003265', '#2563eb', '#FF6C0C'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        /* --- NAVEGACIÓN --- */

        /* --- RENDER FASE (TARJETAS) --- */
        function renderPhase(phaseNum, container) {
            const phaseNames = ["", "1. Planning & Analysis", "2. Design & Architecture", "3. Development", "4. Testing", "5. Deployment"];
            const words = vocabularyData.filter(w => w.phase === phaseNum);
            
            let html = `
                <div style="text-align: center; margin-bottom: 50px;">
                    <h2 style="font-size: 40px; color: var(--text-dark);">Phase ${phaseNames[phaseNum]}</h2>
                    <p style="color: var(--text-light); font-size: 20px; margin-top:10px;">Estudia las tarjetas interactivas y prepárate para el reto final.</p>
                </div>
                <div class="cards-grid">
            `;

            words.forEach((word) => {
                const fileBaseName = word.term.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const imageSrc = `img/phase${phaseNum}/${fileBaseName}.jpg`; 
                const fallbackImg = `https://placehold.co/600x400/003265/FFFFFF?text=Falta+Imagen+Local%5Cnimg/phase${phaseNum}/${fileBaseName}.jpg`;
                let logoIcon = ["fa-cogs", "fa-clipboard-list", "fa-pen-ruler", "fa-laptop-code", "fa-bug", "fa-server"][phaseNum];

                html += `
                    <div class="term-card">
                        <div class="term-img-container">
                            <img src="${imageSrc}" class="term-img" alt="${word.term}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                            <div class="tool-badge"><i class="fas ${logoIcon}"></i></div>
                        </div>
                        
                        <div class="term-content">
                            <h3 class="term-title">${word.term}</h3>
                            <div class="term-translation">${word.translation}</div>
                            
                            <div class="term-phonetic">
                                <i class="fas fa-volume-up"></i> ${word.phonetic}
                            </div>
                            
                            <div class="term-desc">
                                <div class="desc-p"><span class="lang-badge bg-en">EN</span> <span>${word.desc_en}</span></div>
                                <div class="desc-p"><span class="lang-badge bg-es">ES</span> <span>${word.desc_es}</span></div>
                            </div>

                            <div class="audio-player">
                                <audio controls><source src="audio/phase${phaseNum}/${fileBaseName}.mp3" type="audio/mpeg"></audio>
                                <small>Archivo: audio/phase${phaseNum}/${fileBaseName}.mp3</small>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML += html;
            
            const gameContainer = document.createElement('div');
            gameContainer.className = 'game-section fade-in';
            container.appendChild(gameContainer);

            if(phaseNum === 1 || phaseNum === 4) { renderMultipleChoice(phaseNum, words, gameContainer); } 
            else if(phaseNum === 2 || phaseNum === 5) { renderMatchingGame(words, gameContainer); } 
            else if(phaseNum === 3) { renderTrueFalse(words, gameContainer); }
        }

        /* ========================================================
           MINIGAME 1: MULTIPLE CHOICE (6 PREGUNTAS)
           ======================================================== */
        let mcData = { index: 0, questions: [], total: 6 };
        function renderMultipleChoice(phase, words, container) {
            const shuffled = [...words].sort(() => 0.5 - Math.random()).slice(0, mcData.total);
            mcData.questions = shuffled.map(w => {
                const wrongs = words.filter(x => x.term !== w.term).sort(() => 0.5 - Math.random()).slice(0, 3);
                return { term: w.term, correct: w.translation, options: [w.translation, ...wrongs.map(x=>x.translation)].sort(()=>0.5 - Math.random()) };
            });
            mcData.index = 0;
            
            container.innerHTML = `
                <div class="game-header">
                    <h3><i class="fas fa-gamepad" style="color:var(--sena-orange)"></i> Translation Challenge</h3>
                    <p>Selecciona la traducción correcta para avanzar.</p>
                </div>
                <div id="mc-area"></div>
            `;
            updateMCGame();
        }

        function updateMCGame() {
            const area = document.getElementById('mc-area');
            if(mcData.index >= mcData.questions.length) {
                triggerConfetti();
                area.innerHTML = `<i class="fas fa-trophy win-icon"></i><h2 style="font-size:36px; color:var(--sena-blue)">¡Reto Superado!</h2><p style="font-size:20px; color:var(--text-light); margin-top:10px;">¡Excelente trabajo completando la fase!</p>`;
                return;
            }
            const q = mcData.questions[mcData.index];
            const progress = ((mcData.index) / mcData.total) * 100;
            
            let html = `
                <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
                <h2 style="font-size:32px; color:var(--sena-orange); margin-bottom:30px; font-weight:900;">"${q.term}"</h2>
                <div style="display:flex; flex-direction:column; gap:8px; max-width:500px; margin:0 auto;">`;
            
            q.options.forEach(opt => {
                html += `<button class="game-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${q.correct.replace(/'/g, "\\'")}')">${opt}</button>`;
            });
            html += `</div><div id="mc-msg" class="feedback-msg"></div>
                     <button id="mc-next" class="action-btn" style="display:none; margin: 0 auto;" onclick="mcData.index++; updateMCGame();">Siguiente Pregunta <i class="fas fa-arrow-right" style="margin-left: 10px;"></i></button>`;
            area.innerHTML = html;
        }

        function checkMC(btn, selected, correct) {
            document.querySelectorAll('#mc-area .game-btn').forEach(b => b.style.pointerEvents = 'none');
            const msg = document.getElementById('mc-msg');
            if(selected === correct) {
                btn.classList.add('correct');
                msg.innerHTML = '<span style="color:var(--success)"><i class="fas fa-check-circle"></i> ¡Correcto!</span>';
            } else {
                btn.classList.add('error');
                msg.innerHTML = '<span style="color:var(--error)"><i class="fas fa-times-circle"></i> Incorrecto</span>';
                document.querySelectorAll('#mc-area .game-btn').forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }
            document.getElementById('mc-next').style.display = 'block';
        }

        /* ========================================================
           MINIGAME 2: MATCHING GAME (6 PARES)
           ======================================================== */
        let matchState = { left: null, right: null, matches: 0, total: 6 };
        function renderMatchingGame(words, container) {
            matchState.matches = 0; matchState.left = null; matchState.right = null;
            const pairs = [...words].sort(() => 0.5 - Math.random()).slice(0, matchState.total);
            const terms = [...pairs].map(p=>({id: p.term, text: p.term, type: 'left'})).sort(() => 0.5 - Math.random());
            const defs = [...pairs].map(p=>({id: p.term, text: p.translation, type: 'right'})).sort(() => 0.5 - Math.random());
            
            let html = `
                <div class="game-header">
                    <h3><i class="fas fa-link" style="color:var(--sena-orange)"></i> Power Match</h3>
                    <p>Encuentra los ${matchState.total} pares. Selecciona un término y luego su traducción.</p>
                </div>
                <div class="progress-container"><div id="match-progress" class="progress-bar" style="width: 0%"></div></div>
                <div id="match-msg" class="feedback-msg"></div>
                <div class="match-grid" id="match-grid-area">
                    <div class="match-col" id="col-terms">
                        ${terms.map(t => `<button class="game-btn match-btn" onclick="handleMatch(this, '${t.id}', 'left')">${t.text}</button>`).join('')}
                    </div>
                    <div class="match-col" id="col-defs">
                        ${defs.map(d => `<button class="game-btn match-btn" onclick="handleMatch(this, '${d.id}', 'right')">${d.text}</button>`).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function handleMatch(btn, id, type) {
            if(btn.classList.contains('matched')) return;
            
            if(type === 'left') {
                if(matchState.left) matchState.left.btn.classList.remove('selected');
                matchState.left = {btn, id}; btn.classList.add('selected');
            } else {
                if(matchState.right) matchState.right.btn.classList.remove('selected');
                matchState.right = {btn, id}; btn.classList.add('selected');
            }

            if(matchState.left && matchState.right) {
                const b1 = matchState.left.btn, b2 = matchState.right.btn;
                if(matchState.left.id === matchState.right.id) {
                    b1.classList.remove('selected'); b1.classList.add('correct');
                    b2.classList.remove('selected'); b2.classList.add('correct');
                    document.getElementById('match-msg').innerHTML = '<span style="color:var(--success)">¡Conexión Perfecta!</span>';
                    
                    matchState.matches++;
                    document.getElementById('match-progress').style.width = `${(matchState.matches / matchState.total) * 100}%`;

                    setTimeout(() => { b1.classList.add('matched'); b2.classList.add('matched'); }, 600);
                    
                    if(matchState.matches === matchState.total) {
                        setTimeout(() => {
                            triggerConfetti();
                            document.getElementById('match-grid-area').innerHTML = `<div style="grid-column: span 2; margin-top:20px;"><i class="fas fa-trophy win-icon"></i><h2 style="font-size:36px; color:var(--sena-blue)">¡Juego Superado!</h2></div>`;
                            document.getElementById('match-msg').innerHTML = "";
                        }, 800);
                    }
                } else {
                    b1.classList.remove('selected'); b1.classList.add('error');
                    b2.classList.remove('selected'); b2.classList.add('error');
                    document.getElementById('match-msg').innerHTML = '<span style="color:var(--error)">Inténtalo de nuevo</span>';
                    setTimeout(() => { b1.classList.remove('error'); b2.classList.remove('error'); }, 800);
                }
                matchState.left = null; matchState.right = null;
            }
        }

        /* ========================================================
           MINIGAME 3: TRUE OR FALSE (6 PREGUNTAS)
           ======================================================== */
        let tfData = { index: 0, items: [], total: 6 };
        function renderTrueFalse(words, container) {
            const selected = [...words].sort(() => 0.5 - Math.random()).slice(0, tfData.total);
            tfData.items = selected.map(w => {
                const isTrue = Math.random() > 0.5;
                const showDesc = isTrue ? w.desc_es : words.filter(x=>x.term !== w.term)[0].desc_es;
                return { term: w.term, desc: showDesc, isTrue: isTrue };
            });
            tfData.index = 0;
            
            container.innerHTML = `
                <div class="game-header">
                    <h3><i class="fas fa-balance-scale" style="color:var(--sena-orange)"></i> Verdadero o Falso</h3>
                    <p>¿Coincide la descripción con el término técnico?</p>
                </div>
                <div id="tf-area"></div>
            `;
            updateTFGame();
        }

        function updateTFGame() {
            const area = document.getElementById('tf-area');
            if(tfData.index >= tfData.items.length) {
                triggerConfetti();
                area.innerHTML = `<i class="fas fa-trophy win-icon"></i><h2 style="font-size:36px; color:var(--sena-blue)">¡Reto Completado!</h2><p style="font-size:20px; color:var(--text-light); margin-top:10px;">¡Eres un experto en esta fase!</p>`;
                return;
            }
            const q = tfData.items[tfData.index];
            const progress = ((tfData.index) / tfData.total) * 100;
            
            area.innerHTML = `
                <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
                <div class="tf-card">
                    <div class="tf-term">${q.term}</div>
                    <div class="tf-desc">"${q.desc}"</div>
                </div>
                <div class="tf-actions">
                    <button class="action-btn green" onclick="checkTF(this, true, ${q.isTrue})"><i class="fas fa-check"></i> TRUE</button>
                    <button class="action-btn red" onclick="checkTF(this, false, ${q.isTrue})"><i class="fas fa-times"></i> FALSE</button>
                </div>
                <div id="tf-msg" class="feedback-msg"></div>
                <button id="tf-next" class="action-btn" style="display:none; margin: 0 auto;" onclick="tfData.index++; updateTFGame();">Siguiente Ronda <i class="fas fa-arrow-right"></i></button>
            `;
        }

        function checkTF(btn, guess, actual) {
            document.querySelectorAll('.tf-actions .action-btn').forEach(b => b.style.pointerEvents = 'none');
            const msg = document.getElementById('tf-msg');
            if(guess === actual) {
                msg.innerHTML = '<span style="color:var(--success)"><i class="fas fa-check-circle"></i> ¡Correcto!</span>';
            } else {
                msg.innerHTML = '<span style="color:var(--error)"><i class="fas fa-times-circle"></i> Incorrecto</span>';
            }
            document.getElementById('tf-next').style.display = 'block';
        }

        // Iniciar en la página principal
        window.onload = () => navigate('home');
    </script>
</body>
</html>
